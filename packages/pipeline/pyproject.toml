[project]
name = "ragdoll-pipeline"
version = "0.1.0"
description = "Ingestion, retrieval and evaluation for ragdoll. Runs entirely on your machine."
requires-python = ">=3.13"
dependencies = [
  "anthropic>=0.40",
  "pypdf>=5.1",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
]

[project.scripts]
ragdoll = "ragdoll.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoll"]
