[project]
name = "ragdoll-workspace"
version = "0.1.0"
description = "ragdoll — a platform for creating RAG pipelines"
requires-python = ">=3.13"
dependencies = ["ragdoll-pipeline"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ragdoll-pipeline = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "ty>=0.0.1a1"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/pipeline/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*" = ["ANN"]

[tool.ty.src]
include = ["packages/pipeline/src", "packages/pipeline/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/pipeline/tests"]
addopts = "-q --strict-markers"
